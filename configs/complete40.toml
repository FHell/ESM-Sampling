# The completed model on 40 nodes: flow design with the adaptive fine kernel, physical
# measure, line losses and soft limits, lossy DC links, fleet unit commitment, fine-level
# weather moves, α = 1. A short test configuration (4 chains).
out = "results/complete40.h5"
basis = "flow"
fine_kernel = "adaptive"
measure = "physical"
levels = [[10, 24], [40, 24], [40, 6]]
init = "heuristic"
losses = true
thermal = "soft"
link_losses = true
uc = ["gas", "nuclear"]
fine_weather = 0.05
use_bias = true
descent_iters = 0
warmup0 = 10
mlda_warmup = 10
nsamples = 20
