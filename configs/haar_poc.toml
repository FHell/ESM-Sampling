# 40-node base configuration of the CPU and device tests (test/, device/test/): graph
# Haar basis, levels countries daily → nodes daily → nodes 6-hourly, α = 0. The tests
# override the model options they need.
out = "results/haar_poc.h5"
basis = "haar"
levels = [[10, 24], [40, 24], [40, 6]]
use_bias = false
descent_iters = 1500
warmup0 = 30
mlda_warmup = 10
nsamples = 30
