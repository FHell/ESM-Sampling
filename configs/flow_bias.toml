# Flow-based hierarchical design (docs/flow_hierarchy.md): transport modes from the
# congestion-aware proxy PCA as the coarse angle coordinates, graph-Haar cells for the
# dispatch, SoC storage, renewables as negative load, local exact kernel with the flow
# families and storage multiscale moves.
out = "results/flow_bias.h5"
basis = "flow"
kernel = "local"
storage = "soc"
renewables = "load"
levels = [[10, 24], [40, 24], [40, 6]]
alpha0 = false
descent_iters = 0
warmup0 = 10
n0 = 10
J = [2, 2]
p_fine = 0.7
mlda_warmup = 5
nsamples = 20
use_bias = true
init = "heuristic"
bias_warmstart = 0.0
fine_kernel = "adaptive"
bias_start = 3
bias_every = 2
