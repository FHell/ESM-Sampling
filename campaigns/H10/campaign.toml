# Campaign H10 (docs/campaigns.md, row H10; ledger E27 in docs/experiments.md; docs/system/hpc.md)
id = "H10"
commit = ""          # the commit of the campaign worktree (hpc/new_campaign.sh H10); recorded in every run.toml
question = """
Do the cross-node storage pairs (sxpair, sxlong; ledger E27, docs/system/moves/storage.md) make
the seasonal storage relax faster at fixed (k, x) than the E21 kernel (slong, slevel), at equal
CPU: the seasonal shape Q1 − Q3 per hydro and PHS unit, the regional storage shapes, and opex,
which still drifted after 3000 sweeps locally (E27: one start state, the old model file)?"""
design = """
Self-contained: every input is made on the cluster (hpc.md §6). Model file: the cluster's
data/processed/model.h5 of step D1 (hpc.md §8.3; the build with the corrected wind calibration),
read by configs/chains40.toml (40 nodes daily, fixed weather draw from its seed). Two capacity
configurations, made in the run from the config and its seed: `heuristic` (the set-up's
heuristic capacities and interior dispatch) and `lp` (the reference LP at the config's levels,
HiGHS; solved once by stage 1 into the shared cache, then read by the runs). From each, 500
operation sweeps of the E21 kernel on a stream of their own (identical for the three kernels of a
start: the summaries carry the state's hash), then 5000 sweeps of each kernel: slong (E21: 32
slong + 1 slevel per unit with >= 24 h), sx (the defaults: plus 8 sxlong per unit and sxpair at
rate 0.1), sx16 (16 sxlong, sxpair 0.2). Protocol of opmix.jl (scripts/mixing/opmix_hpc.jl):
operation sweeps only (local sweep, storage multiscale sweep with probability 1/2, long-range
storage sweep every sweep), no capacity or weather moves. Six array tasks
(campaigns/H10/list.txt), 8 cores each (cpu_array.sbatch default; all tasks the same, so the
burn-in states agree bitwise), standby and requeued; the script snapshots every 10 minutes and
at the stop file, also in the burn-in, and resumes exactly. About 0.6-1 s per sweep, so
1.5-2 h per task. Outputs per run: summary_opmix.toml (start, burn-in, tau, drift, sd per
quantity and per storage unit, cost per sweep, long-sweep move statistics), summary_trace.csv
(per-sweep series for equal-CPU comparisons), summary_burnin.csv, opmix.jls (full record,
archive only). Equal CPU: tau x s/sweep of runs on the same partition."""
needs = "D1 (data/processed/model.h5 rebuilt with the corrected wind calibration, hpc.md §8.3)"
stage1 = "sbatch hpc/jobs/build.sbatch H10 configs/chains40.toml script scripts/lp_reference.jl"
stage2 = "sbatch --dependency=afterok:<job id of stage 1> --array=1-6%6 hpc/jobs/cpu_array.sbatch H10 campaigns/H10/list.txt"
collect = "bash hpc/collect.sh H10 'summary*'"
analysis = """
The summaries give tau, drift and the cost per sweep per run; summary_trace.csv the equal-CPU
opex and per-unit shapes; scripts/mixing/smix_analyze.jl reads the full records (opmix.jls from
the archive, prefixes by run)."""
