data = "data/processed/model256.h5"
# Campaign H5 (device throughput on the H100; docs/campaigns.md, campaigns/H5/campaign.toml).
# Device profiling run (mechanics test: α = 0, physical measure, capacity scaling): 256 nodes daily, GPU.
out = "results/h5_fams256_24h.h5"
basis = "haar"
storage = "soc"
renewables = "load"
measure = "physical"
levels = [[10, 24], [256, 24]]
