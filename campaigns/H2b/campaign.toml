id = "H2b"
question = """
PyPSA-Eur's own optimum and MGA envelopes on its network configured to our scope (validation.md
§2.2, §2.7): the reference that our LP (H2) and our sampler are compared with, on the side where
PyPSA solves its own problem. One weather year (2013, the year of the build), the resolution ladder
24 h / 6 h / 3 h (and an hourly attempt).
"""
design = """
scripts/pypsa_baseline.py (run.sh python mode, the root project's uv environment: pypsa 1.4,
HiGHS through highspy) on ${ESM_PYPSA_EUR}/resources/esm256/networks/composed_2050.nc of the
cluster's PyPSA-Eur build (prepare_data.sh pypsa256; rebuilt with the wind-calibration fix if
the build is redone). Scope: AC lines and DC links at their ratings, load shedding at 3000 EUR/MWh,
the build's CO2 cap (5e7 t; its dual is the CO2 price), time series averaged over blocks of the
