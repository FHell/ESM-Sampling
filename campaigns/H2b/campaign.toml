  list.txt        (6)   optimum at 24 h and 6 h; MGA at 24 h, one line per eps (1, 2, 5, 10 %; 12 solves each)
  list_mga6h.txt  (6)   MGA at 6 h, eps 5 %, one line per carrier group (2 solves each)
  list_large.txt  (1)   optimum at 3 h (HiGHS time limit 400000 s)
  list_hold.txt   (1)   optimum at 1 h: estimated beyond a week; not submitted without the user's OK
  list_smoke.txt  (1)   the local smoke case (14 daily snapshots, no CO2 cap, eps 5 %, onwind and gas)
